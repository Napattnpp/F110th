# ==============================================================================
# GLOBAL PLANNER PARAMETERS TEMPLATE (ADR-004 / ADR-005)
# ==============================================================================
# ROLE: Canonical template schema for offline trajectory optimization.
# NOTE: Do NOT tune parameters directly in this file for active racing maps.
#       When initializing a map (`make init_map MAP=<name>`), this template is
#       copied into `assets/maps/<name>/waypoint_gen/global_planner_params.yaml`.
#       Each map maintains its own parameters as the Single Source of Truth (SSOT).
# ==============================================================================

global_planner:
  ros__parameters:
    rate: 10  # [hz]
    required_laps: 3  # how many laps to drive until calculating global waypoints
    # ── Safety Width Clearance Margins (Total Corridor Reduction = 2 * Wall Buffer) ──
    safety_width: 1.05     # [m] Clearance buffer for Minimum Curvature raceline (0.30m wall buffer per side)
    safety_width_sp: 1.05  # [m] Clearance buffer specifically for Shortest Path trajectory (0.25m inner corner buffer per side)
    occupancy_grid_threshold: 10
    filter_kernel_size: 3  # Morphological filter kernel size for raw map image noise removal (keep <= 5 for narrow tracks)
    reverse_mapping: False # Set True to reverse driving direction of this track

    show_plots: False

