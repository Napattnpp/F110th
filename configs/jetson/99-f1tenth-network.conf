# Optimized Linux Kernel UDP & IP Fragment Buffers for F1TENTH High-Speed Autonomy
net.core.rmem_max=2147483647
net.core.wmem_max=2147483647
net.core.rmem_default=33554432
net.core.wmem_default=33554432

# Increase network interface card driver backlog queue for high-rate Ethernet LiDARs
net.core.netdev_max_backlog=10000

# Flush dropped UDP fragments instantly (3s instead of default 30s) to prevent lockups under high-frequency LiDAR
net.ipv4.ipfrag_time=3
net.ipv4.ipfrag_high_thresh=134217728
net.ipv4.ipfrag_low_thresh=100663296
