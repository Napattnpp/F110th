# ==============================================================================
# F1TENTH — Tmux Configuration
# Optimized for Docker, SSH, VS Code Remote, and Zero-Friction Terminal Copy
# ==============================================================================

# Enable mouse mode (scrolling, pane selection, resizing)
set -g mouse on

# Increase scrollback buffer history
set -g history-limit 50000

# Color support
set -g default-terminal "screen-256color"

# Use vi keybindings in copy mode
setw -g mode-keys vi

# Enable OSC 52 clipboard (automatically syncs tmux copy buffer to local Mac clipboard over SSH)
set -s set-clipboard on

# Copy Mode Keybindings:
# - Drag to select text: keeps selection visible without instantly exiting
# - Press 'y' in copy mode: copies selection to system clipboard
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# Double click to select word, triple click to select line
bind -n DoubleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-word
bind -n TripleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-line

# Toggle synchronize-panes across windows
bind e set-window-option synchronize-panes

# TPM Plugin Manager (optional if installed)
if-shell "test -f ~/.tmux/plugins/tpm/tpm" \
    "set -g @plugin 'tmux-plugins/tpm'; \
     set -g @plugin 'tmux-plugins/tmux-resurrect'; \
     set -g @plugin 'tmux-plugins/tmux-continuum'; \
     set -g @continuum-restore 'on'; \
     run '~/.tmux/plugins/tpm/tpm'"
