# ==============================================================================
# F1TENTH — High-Performance Trackside Tmux Configuration
# Optimized for Docker, SSH, VS Code Remote, Multi-Pane Pitlane Orchestration,
# and Zero-Friction Terminal Clipboard Copy
# ==============================================================================

# Enable mouse mode (scrolling, pane selection, resizing)
set -g mouse on

# Increase scrollback buffer history (critical for long ros2 launch logs)
set -g history-limit 50000

# Color support & truecolor
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# 1-indexed windows and panes (matches keyboard row 1-2-3-4)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Use vi keybindings in copy mode
setw -g mode-keys vi

# Enable OSC 52 clipboard (automatically syncs tmux copy buffer to local Mac clipboard over SSH)
set -s set-clipboard on

# Fast config reload
bind r source-file ~/.tmux.conf \; display-message "✓ Tmux config reloaded!"

# Retain current working directory when splitting or creating windows
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style directional pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Repeatable pane resizing with Prefix + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy Mode Keybindings:
# - 'v' begins selection in vi mode
# - 'y' or mouse drag release copies selection to clipboard and returns to shell
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi q send-keys -X cancel

# Double click to select & copy word, triple click to select & copy whole line
bind -n DoubleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel
bind -n TripleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel

# Toggle synchronize-panes across windows (broadcast commands to all panes)
bind e set-window-option synchronize-panes

# F1TENTH Status Bar (Clean, informative, racing-ready)
set -g status-position bottom
set -g status-style bg=colour235,fg=colour252
set -g status-left-length 40
set -g status-left "#[bg=colour33,fg=colour232,bold] 🏎️  F1TENTH #[bg=colour238,fg=colour255] #S #[default] "
set -g status-right-length 80
set -g status-right "#[fg=colour244]ROS_DOMAIN=#[fg=colour75,bold]#(echo \${ROS_DOMAIN_ID:-0}) #[fg=colour244]| #[fg=colour119]#(hostname -I 2>/dev/null | awk '{print \$1}') #[fg=colour244]| #[fg=colour250]%H:%M #[default]"
setw -g window-status-current-style bg=colour75,fg=colour232,bold
setw -g window-status-current-format " #I:#W#F "
setw -g window-status-style fg=colour245
setw -g window-status-format " #I:#W "

# TPM Plugin Manager (optional if installed)
if-shell "test -f ~/.tmux/plugins/tpm/tpm" \
    "set -g @plugin 'tmux-plugins/tpm'; \
     set -g @plugin 'tmux-plugins/tmux-resurrect'; \
     set -g @plugin 'tmux-plugins/tmux-continuum'; \
     set -g @continuum-restore 'on'; \
     run '~/.tmux/plugins/tpm/tpm'"
