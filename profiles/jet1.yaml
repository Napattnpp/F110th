metadata:
  name: "jet1"
  description: "F1TENTH Physical Car #2 - NVIDIA Jetson Orin, VESC 6/7, RPLiDAR S1/S2, ICM20948"
  compute_platform: "jetson_orin"
  version: "1.0.0"

geometry_mass:
  wheelbase: 0.3240
  track_width: 0.2300
  mass: 3.65
  cog_front: 0.1550
  cog_rear: 0.1690
  moment_inertia_z: 0.05120

steering_powertrain:
  steering_to_servo_gain: 1.2135
  steering_to_servo_offset: 0.4800
  max_steering_angle_rad: 0.4363
  servo_min: 0.18
  servo_max: 0.85
  speed_to_erpm_gain: -3440.0
  speed_to_erpm_offset: 0.0
  max_current_a: 95.0
  max_acceleration: 3.5
  wheel_radius_m: 0.050

sensor_extrinsics:
  lidar_tf: [0.280, 0.0, 0.120, 0.0, 0.0, 0.0]
  lidar_port: "/dev/sensors/rplidar"
  vesc_port: "/dev/sensors/vesc"
  imu_topic: "/imu"
  imu_type: "icm20948"

tuning_defaults:
  lookahead_min: 0.50
  lookahead_max: 2.80
  max_speed_mps: 7.50
  aeb_ttc_threshold: 0.42

