metadata:
  name: "sim"
  description: "F1TENTH Gym ROS 2 Asynchronous Simulator Virtual Vehicle"
  compute_platform: "simulation"
  version: "1.0.0"

geometry_mass:
  wheelbase: 0.3302
  track_width: 0.2032
  mass: 3.47
  cog_front: 0.15875
  cog_rear: 0.17145
  moment_inertia_z: 0.04712

steering_powertrain:
  steering_to_servo_gain: 1.2135
  steering_to_servo_offset: 0.5000
  max_steering_angle_rad: 0.4189
  servo_min: 0.00
  servo_max: 1.00
  speed_to_erpm_gain: 3440.0
  speed_to_erpm_offset: 0.0
  max_current_a: 80.0
  max_acceleration: 6.0
  wheel_radius_m: 0.050

sensor_extrinsics:
  lidar_tf: [0.275, 0.0, 0.10, 0.0, 0.0, 0.0]
  lidar_port: "virtual"
  vesc_port: "virtual"
  imu_topic: "/imu"
  imu_type: "sim"

tuning_defaults:
  lookahead_min: 0.80
  lookahead_max: 3.20
  max_speed_mps: 8.00
  aeb_ttc_threshold: 0.45
