metadata:
  name: "nuc1"
  description: "F1TENTH Physical Car #1 - Intel NUC i7, VESC 6, RPLiDAR S1, ICM20948"
  compute_platform: "intel_nuc"
  version: "1.0.0"

geometry_mass:
  wheelbase: 0.3000
  track_width: 0.2250
  mass: 3.52
  cog_front: 0.1450
  cog_rear: 0.1550
  moment_inertia_z: 0.04850

steering_powertrain:
  steering_to_servo_gain: 1.2135
  steering_to_servo_offset: 0.4500
  max_steering_angle_rad: 0.4189
  servo_min: 0.20
  servo_max: 0.82
  speed_to_erpm_gain: -3440.0
  speed_to_erpm_offset: 0.0
  max_current_a: 91.53
  max_acceleration: 2.0
  wheel_radius_m: 0.050

sensor_extrinsics:
  lidar_tf: [0.275, 0.0, 0.115, 0.0, 0.0, 0.0]
  lidar_port: "/dev/sensors/rplidar"
  vesc_port: "/dev/sensors/vesc"
  imu_topic: "/imu"
  imu_type: "icm20948"

tuning_defaults:
  lookahead_min: 0.42
  lookahead_max: 2.50
  max_speed_mps: 6.50
  aeb_ttc_threshold: 0.40
