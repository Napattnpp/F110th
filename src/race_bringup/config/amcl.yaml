amcl:
  ros__parameters:
    use_sim_time: false

    # --- Motion model (odometry noise) ---
    # Slightly tightened vs. default: with only 1m of width to work with,
    # letting the particle cloud spread too much on turns causes particles
    # to "see through" walls onto the wrong track section, especially near
    # the narrow chicane/finger sections in your layout.
    alpha1: 0.15
    alpha2: 0.15
    alpha3: 0.3
    alpha4: 0.3
    alpha5: 0.15
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: "scan"

    # --- Particle filter sizing ---
    # Reduced from 500/2000: the RPLidar S1's ranging accuracy (~3cm) is
    # good enough that you don't need a huge particle cloud to converge -
    # fewer particles = less CPU per update = more stable loop timing.
    min_particles: 300
    max_particles: 1500
    pf_err: 0.05
    pf_z: 0.99
    # Resample every 2nd update instead of every update. This is the main
    # efficiency lever: it roughly halves resampling overhead for a small,
    # usually negligible hit to convergence speed.
    resample_interval: 2

    # --- Sensor model (likelihood field) ---
    laser_model_type: "likelihood_field"
    # S1 is rated to ~40m, but your track only needs ~15m to cover the
    # 20m long axis. Capping here (rather than at 40m) keeps the
    # likelihood-field lookup cheap and ignores anything reflecting off
    # objects outside the track.
    laser_max_range: 15.0
    # S1's real minimum range is ~0.15m - setting this to match avoids
    # feeding the filter bogus close-in returns as if they were valid.
    laser_min_range: 0.15
    # S1 accuracy is good, so sigma_hit can sit tighter than a generic
    # sensor's default - but duct-tape walls still scatter a bit, so this
    # isn't dropped all the way back to a "rigid wall" value.
    sigma_hit: 0.15
    lambda_short: 0.1
    z_hit: 0.7
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.2
    laser_likelihood_max_dist: 1.5
    # S1 outputs ~900+ points/rotation at 10Hz. Subsampling to 200 keeps
    # angular resolution well above what a 1m corridor needs, while
    # cutting per-scan compute by more than half vs. using every beam.
    max_beams: 200
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    # --- Update thresholds ---
    # Relaxed slightly from the tight 0.05/0.05 version: this cuts how
    # often the filter runs at all, which is the single biggest lever for
    # steady-state CPU load. Still tighter than the ROS default (0.1/0.1)
    # since the corridor is only 1m wide.
    update_min_d: 0.08
    update_min_a: 0.08

    # --- Recovery ---
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

    save_pose_rate: 0.5
    transform_tolerance: 1.0

    # --- Initial pose ---
    # Update x/y/yaw below to match wherever you actually place the car
    # at the start of each run on this map - it's currently the map
    # origin (0,0,0), which only works if you always start there.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
