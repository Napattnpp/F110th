amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    min_particles: 1000
    max_particles: 2800
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    laser_model_type: likelihood_field
    laser_max_range: 30.0
    laser_min_range: 0.15
    sigma_hit: 0.08
    lambda_short: 0.1
    z_hit: 0.85
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.05
    laser_likelihood_max_dist: 2.0
    max_beams: 100
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    update_min_d: 0.05
    update_min_a: 0.05
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    save_pose_rate: 0.5
    transform_tolerance: 1.0
    set_initial_pose: true
    initial_pose:
      x: 0.566
      y: -8.3632
      z: 0.0
      yaw: -2.8703
