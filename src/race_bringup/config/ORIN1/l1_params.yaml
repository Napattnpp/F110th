controller:
  ros__parameters:
    LUT_name: "ORIN1_hangar_pacejka"
    # ── Lookahead distance: L1 = q_l1 + speed * m_l1, clipped to [t_clip_min, t_clip_max] ──
    # OSCILLATION FIX: increase t_clip_min → longer lookahead → smoother path, less oscillation
    # Too short (<0.6m) on tight track → car snaps full steering lock and cuts into inside walls
    # Too long (>1.5m) → car understeers wide
    t_clip_min: 0.75      # Smooth lookahead to eliminate violent sharp corner snapping
    t_clip_max: 2.5       # Upper lookahead limit
    m_l1: 0.50            # Lookahead time multiplier
    q_l1: 0.35            # Base lookahead distance offset

    # ── Speed & Braking Lookahead ──
    speed_lookahead: 0.35            # Sample lower speeds earlier to brake BEFORE corners
    lat_err_coeff: 0.50

    # ── Steer scaling based on acceleration ──
    acc_scaler_for_steer: 1.00       # Keep linear steering (1.15 was over-steering into inner walls under throttle)
    dec_scaler_for_steer: 0.95

    # ── High-speed steer downscaling ──
    start_scale_speed: 7.0
    end_scale_speed: 8.0
    downscale_factor: 0.2

    speed_lookahead_for_steer: 0.0   # Disabled corner-cutting lookup (0.22 was aggressively cutting apexes)

    ## Acceleration Based Velocity Controller Parameters
    vel_accel_mode: False
    vel_ctr_p_gain: 1.8
    vel_ctr_i_gain: 0.0
    vel_ctr_d_gain: 0.2

    ## Trailing Controller Parameters
    allow_accel_trailing: False
    trailing_mode: True #True = Distance, False = Time
    prioritize_dyn: True
    trailing_gap: 2.0 # Distance in meters or gap in seconds, depending on mode
    trailing_p_gain: 1.0
    trailing_i_gain: 0.0
    trailing_d_gain: 0.2
    blind_trailing_speed: 1.5


