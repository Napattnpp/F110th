/**:
  ros__parameters:
    sensor_type: "icm20948"
    i2c_device: "/dev/i2c-7"
    i2c_addr: 0x68
    frame_id: "imu_link"
    rate_hz: 80

    accel_range_g: 2
    gyro_range_dps: 2000
    gyro_scale_z: 1.00515
    auto_calibrate_gyro: true

    # These values should be filled after running calibrate_gyro
    gyro_bias_x: 0.0155567
    gyro_bias_y: 0.0120399
    gyro_bias_z: 0.00178871

    accel_bias_x: 0.0
    accel_bias_y: 0.0
    accel_bias_z: 0.0

    # Covariance diagonals (x, y, z)
    accel_covariance: [0.00098372, 0.00122845, 0.00126125]
    gyro_covariance: [0.00002385, 0.00000719, 0.00000653]
