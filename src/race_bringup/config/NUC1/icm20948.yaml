/**:
  ros__parameters:
    sensor_type: "icm20948"
    i2c_device: "/dev/i2c-7"
    i2c_addr: 0x68
    frame_id: "imu_link"
    rate_hz: 80

    accel_range_g: 2
    gyro_range_dps: 2000
    gyro_scale_z: 1.00515
    auto_calibrate_gyro: true

    # These values should be filled after running calibrate_gyro
    gyro_bias_x: 0.0199589
    gyro_bias_y: 0.0146511
    gyro_bias_z: 0.00246422

    accel_bias_x: 0.0
    accel_bias_y: 0.0
    accel_bias_z: 0.0

    # Covariance diagonals (x, y, z)
    accel_covariance: [0.00086408, 0.00101706, 0.00121946]
    gyro_covariance: [0.00001165, 0.00000635, 0.00000643]
