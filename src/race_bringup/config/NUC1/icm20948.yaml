/**:
  ros__parameters:
    sensor_type: "icm20948"
    i2c_device: "/dev/i2c-7"
    i2c_addr: 0x68
    frame_id: "imu_link"
    rate_hz: 80

    accel_range_g: 2
    gyro_range_dps: 250
    gyro_scale_z: 1.006
    auto_calibrate_gyro: true

    # These values should be filled after running calibrate_gyro
    gyro_bias_x: 0.0221905
    gyro_bias_y: 0.0110288
    gyro_bias_z: 0.00236582

    accel_bias_x: 0.0
    accel_bias_y: 0.0
    accel_bias_z: 0.0

    # Covariance diagonals (x, y, z)
    accel_covariance: [0.00090426, 0.00099860, 0.00085567]
    gyro_covariance: [0.00000865, 0.00000668, 0.00000560]
