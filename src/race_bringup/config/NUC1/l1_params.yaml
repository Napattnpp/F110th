controller:
  ros__parameters:
    LUT_name: "NUC1_hangar_pacejka"
    # ── Lookahead distance: L1 = q_l1 + speed * m_l1, clipped to [t_clip_min, t_clip_max] ──
    # OSCILLATION FIX: increase t_clip_min → longer lookahead → smoother path, less oscillation
    # Too short (0.8m) on tight track → car overshoots corners → oscillates
    # Too long → car cuts corners / slow to respond
    t_clip_min: 0.42      # Sharpened lookahead to prevent late turn-in on tight corners
    t_clip_max: 2.5       # Upper lookahead limit
    m_l1: 0.70            # Lookahead time multiplier
    q_l1: 0.15            # Base lookahead distance offset

    # ── Speed & Braking Lookahead ──
    speed_lookahead: 0.35            # Increased from 0.25 to sample lower speeds earlier and brake BEFORE sharp corners
    lat_err_coeff: 1.0

    # ── Steer scaling based on acceleration ──
    # Amplify steering during acceleration to counteract weight transfer and front-wheel understeer
    acc_scaler_for_steer: 1.15
    dec_scaler_for_steer: 0.95

    # ── High-speed steer downscaling ──
    start_scale_speed: 7.0
    end_scale_speed: 8.0
    downscale_factor: 0.2

    speed_lookahead_for_steer: 0.22 # Increased from 0.18 to prepare steering angle for upcoming corners

    ## Acceleration Based Velocity Controller Parameters
    vel_accel_mode: False
    vel_ctr_p_gain: 1.8
    vel_ctr_i_gain: 0.0
    vel_ctr_d_gain: 0.2

    ## Trailing Controller Parameters
    allow_accel_trailing: False
    trailing_mode: True #True = Distance, False = Time
    prioritize_dyn: True
    trailing_gap: 2.0 # Distance in meters or gap in seconds, depending on mode
    trailing_p_gain: 1.0
    trailing_i_gain: 0.0
    trailing_d_gain: 0.2
    blind_trailing_speed: 1.5


