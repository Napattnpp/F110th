controller:
  ros__parameters:
    LUT_name: "NUC1_hangar_pacejka"
    # ── Lookahead distance: L1 = q_l1 + speed * m_l1, clipped to [t_clip_min, t_clip_max] ──
    # OSCILLATION FIX: increase t_clip_min → longer lookahead → smoother path, less oscillation
    # Too short (0.8m) on tight track → car overshoots corners → oscillates
    # Too long → car cuts corners / slow to respond
    # MAX ALLOWED: 1.0 (hard limit in controller_manager.py FloatingPointRange)
    t_clip_min: 0.45      # Increased to be larger than wheelbase (0.33m) to prevent low-speed oscillations
    t_clip_max: 2.5       # Increased to 2.5 to allow larger lookahead at high speed (20000 ERPM)
    m_l1: 0.78             # Set lookahead time to 0.7 seconds (well within [0.0, 1.0] limit)
    q_l1: 0.15             # Slightly increased base offset for low speed stability

    speed_lookahead: 0.25
    lat_err_coeff: 1.0

    # ── Steer scaling based on acceleration ──
    # 1.2 amplifies steering when accelerating from standstill → causes extra snap at corners
    # Set to 1.0 (neutral) while tuning at low speed
    acc_scaler_for_steer: 1.0   # was 1.2 — set back to 1.2 once driving smoothly at speed
    dec_scaler_for_steer: 0.9

    # ── High-speed steer downscaling (not relevant at 0.3 m/s) ──
    start_scale_speed: 7.0
    end_scale_speed: 8.0
    downscale_factor: 0.2

    speed_lookahead_for_steer: 0.18 # safe/agg 0.0/0.175

    ## Acceleration Based Velocity Controller Parameters
    vel_accel_mode: False
    vel_ctr_p_gain: 1.8
    vel_ctr_i_gain: 0.0
    vel_ctr_d_gain: 0.2

    ## Trailing Controller Parameters
    allow_accel_trailing: False
    trailing_mode: True #True = Distance, False = Time
    prioritize_dyn: True
    trailing_gap: 2.0 # Distance in meters or gap in seconds, depending on mode
    trailing_p_gain: 1.0
    trailing_i_gain: 0.0
    trailing_d_gain: 0.2
    blind_trailing_speed: 1.5


