perception:
  ros__parameters:
    detect:
      rate: 40 # rate at which the node is running
      lambda: 10 # minimum reliables detection angle in degrees
      sigma: 0.02 # standard deviation of noise for RPLIDAR S1
      min_2_points_dist: 0.01 # minimum distance between two points
      min_obs_size: 5
      max_obs_size: 0.8
      max_viewing_distance: 9.0
      boundaries_inflation: 0.22 # Track wall safety margin to reject apex wall clipping

    tracking:
      rate: 40 # rate at which the node is running
      min_persistence_frames: 2 # require 2 consecutive matched frames to suppress ghost obstacles while minimizing detection latency
      min_nb_meas: 5 # minimum number of measurements before static/dynamic voting
      ttl_static: 15 # time-to-live for static obstacles to prevent corner dropout
      P_vs: 0.2 # proportional gain for the vs
      P_d: 0.02 # proportional gain for the d
      P_vd: 0.2 # proportional gain for the vd
      measurment_var_s: 0.002 # the variance of the measurment noise in the s direction
      measurment_var_d: 0.002 # the variance of the measurment noise in the d direction
      measurment_var_vs: 0.2
      measurment_var_vd: 0.2
      process_var_vs: 2 # the variance of the process velocity noise in the s direction
      process_var_vd: 8 # the variance of the process velocity noise in the d direction
      max_dist: 0.5 # max distance for association
      var_pub: 3.0 # obstacles with bigger variance are not published

fake_obstacle_publisher:
  ros__parameters:
    obs_mode: "dynamic_opponent" # "dynamic_opponent", "static_ahead", or "none"
    speed_scaler: 0.60 # for dynamic opponent (60% of raceline speed for realistic racing pace)
    constant_speed: false # dynamically scale with raceline speed profile rather than static crawl
    trajectory: "min_curv"
    start_s: 0.0
    type: "virtual" # "virtual" (Markers+ObstacleArray) or "lidar" (OccupancyGrid)
