state_machine:
  ros__parameters:
    rate_hz: 40  # [hz]
    mode: 'head_to_head' # "head_to_head", "dummy", "timetrials", "qualifying"
    map_name: 'ifac_roboracer'
    initial_state: 'GB_TRACK'  # "GB_TRACK", ...
    test_on_car: True  # also set True if using on a bag
    n_loc_wpnts: 80  # number of local waypoints published, 1 waypoints every 0.1 meter

    volt_threshold: 9.5 # [V] voltage threshold below which we start screaming

    force_state: False  # force state to be the one specified in force_state_choice
    ftg_disabled: True  # disable FTG (Follow the Gap) fallback mode when stuck trailing


    splini_ttl: 0.8 # [s] ttl counter for validity of spliner waypoints
    gb_ego_width_m: 0.4 # [m], distance from gb path for rejoining 
    lateral_width_gb_m: 0.55 # [m] lateral width within which we consider obstacles to be on the raceline
    gb_horizon_m: 10.0 # [m] horizon considered for global waypoints obstacle checking
    overtaking_horizon_m: 10.0 # [m] horizon considered for overtaking
    lateral_width_ot_m: 0.18 # [m] lateral width within which we consider opponents to be on overtaking line
    splini_hyst_timer_sec: 0.02 # [s] time we have to wait between switching sides
    overtake_speed_scale: 1.0 # speed boost fraction applied during OVERTAKE mode (1.0 = single source of truth in spline_planner)

    ftg_threshold_speed: 0.1 # [m/s] speed threshold below which we start a timer for activating FTG
    ftg_timer_sec: 3. # [s] time we have to stay slower than the `ftg_threshold_speed` threshold before we activate FTG

    # Autonomous Crash Recovery parameters
    enable_recovery: True # enable/disable autonomous recovery state machine
    crash_dist_threshold: 0.25 # [m] front LiDAR distance threshold to trigger crash/stuck detection
    stuck_speed_threshold: 0.1 # [m/s] speed threshold below which car is considered stuck
    stuck_time_threshold: 0.6 # [s] duration car must be stuck before triggering recovery
    recovery_stop_time: 0.5 # [s] dwell time at complete standstill after crash before reversing
    recovery_reverse_speed: -0.7 # [m/s] reverse speed during recovery maneuver
    recovery_max_reverse_time: 1.5 # [s] maximum time allowed for reversing
    recovery_align_time: 0.8 # [s] stabilization time in FTG mode after reversing
    recovery_rear_min_dist: 0.15 # [m] minimum rear clearance to prevent reversing into opposite wall
    recovery_front_safe_dist: 0.70 # [m] required front clearance to finish reversing

    # Qualifying mode — lap-based auto-switch
    # Q1 (fast) -> Buffer 1 (slow) -> Q2 (avoidance ON) -> Buffer 2 (slow) -> Q3 (fast)
    q1_laps:            3    # number of full-speed laps before Q2
    buf_laps:           1    # number of slow buffer laps on each side of Q2
    q2_laps:            3    # number of laps with obstacle avoidance active
    q3_laps:            3    # number of full-speed laps after Q2
    buffer_speed_scale: 0.85  # fraction of max speed during buffer laps (0.1 – 1.0)
    q2_speed_scale:     0.9  # fraction of max speed during Q2 avoidance laps (0.1 – 1.0)


