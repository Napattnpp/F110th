state_machine:
  ros__parameters:
    rate_hz: 40  # [hz]
    initial_state: 'GB_TRACK'  # "GB_TRACK", ...
    test_on_car: True  # also set True if using on a bag
    n_loc_wpnts: 80  # number of local waypoints published, 1 waypoints every 0.1 meter

    volt_threshold: 11. # [V] voltage threshold below which we start screaming

    force_state: False  # force state to be the one specified in force_state_choice
    ftg_disabled: True  # disable FTG (Follow the Gap) fallback mode when stuck trailing (preserves racing autonomy)
    ftg_threshold_speed: 0.35 # [m/s] speed below which car is considered blocked/stuck in TRAILING
    ftg_timer_sec: 2.0 # [s] time we have to stay slower than ftg_threshold_speed before activating FTG fallback

