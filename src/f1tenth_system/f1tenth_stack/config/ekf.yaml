ekf_filter_node:
  ros__parameters:
    #> Codex: 2D car model for flat-ground F1TENTH driving.
    two_d_mode: true
    frequency: 50.0
    sensor_timeout: 0.1
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false
    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    #> Codex: Wheel odometry from vesc_to_odom_node.
    odom0: /odom
    odom0_queue_size: 10
    odom0_nodelay: false
    odom0_differential: false
    odom0_relative: false
    odom0_pose_rejection_threshold: 5.0
    odom0_twist_rejection_threshold: 2.0

    
    #> Codex: Config order is [ x, y, z,
    #                           roll, pitch, yaw,
    #                           vx, vy, vz,
    #                           vroll, vpitch, vyaw,
    #                           ax, ay, az
    #                          ]
    #> Codex: Use wheel-odom x, y, yaw, vx, vyaw; ignore the rest for 2D.
    odom0_config: [true, true, false,
                   false, false, true,
                   true, false, false,
                   false, false, true,
                   false, false, false]

    #> Codex: micro-ROS IMU topic from Arduino.
    imu0: /imu/data
    imu0_queue_size: 20
    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: false
    imu0_pose_rejection_threshold: 0.8
    imu0_twist_rejection_threshold: 0.8
    imu0_linear_acceleration_rejection_threshold: 1.5
    imu0_remove_gravitational_acceleration: true
    #> Codex: Same 15-state order as above.
    #> Codex: Use IMU yaw + yaw rate (gyro z); ignore linear accel for now.
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
