/**:
  # general parameters shared by all vesc-related nodes
  ros__parameters:
    # erpm (electrical rpm) = speed_to_erpm_gain * speed (meters / second) + speed_to_erpm_offset
    speed_to_erpm_gain: 3340.0
    speed_to_erpm_offset: 0.0

    # servo value (0 to 1) =  steering_angle_to_servo_gain * steering angle (radians) + steering_angle_to_servo_offset
    steering_angle_to_servo_gain: 1.2135
    steering_angle_to_servo_offset: 0.4750 # .46 to .47

    port: /dev/sensors/vesc
    duty_cycle_min: 0.0
    duty_cycle_max: 0.0
    current_min: 0.0
    current_max: 100.0
    brake_min: -20000.0
    brake_max: 200000.0
    speed_min: -23250.0
    speed_max: 23250.0
    position_min: 0.0
    position_max: 0.0
    servo_min: 0.20
    servo_max: 0.82

# No longer needed, all parameters are shared
# ackermann_to_vesc_node:
#   ros__parameters:

vesc_to_odom_node:
  ros__parameters:
    odom_frame: odom
    base_frame: base_link

    # --------------------------------------------------------------------------
    # TF BROADCAST SWITCH
    # - Set to true ONLY if you are running the vesc_to_odom node standalone 
    #   without any EKF (robot_localization) node.
    # - Must be set to false when EKF is running (ekf_node = True), because EKF
    #   is responsible for broadcasting the odom -> base_link transform.
    #   Having both active will cause TF flickering and jumping in RViz.
    # --------------------------------------------------------------------------
    publish_tf: false
    
    # --------------------------------------------------------------------------
    # HEADING ESTIMATION MODEL
    # - true:  Uses the kinematic bicycle model (wheel speed + steer servo angle)
    #          to calculate angular velocity and yaw. Prone to tire slip.
    # - false: Subscribes to `/yaw_rad` (published by the bmi160_ros2 driver)
    #          and uses it directly as the odometry yaw. (Recommended for EKF).
    # --------------------------------------------------------------------------
    use_servo_cmd_to_calc_angular_velocity: false

    # car wheelbase is about 29.5cm
    wheelbase: 0.295

# No longer needed, all parameters are shared
# vesc_driver:
#   ros__parameters:

throttle_interpolator:
  ros__parameters:
    rpm_input_topic: commands/motor/unsmoothed_speed
    rpm_output_topic: commands/motor/speed
    servo_input_topic: commands/servo/unsmoothed_position
    servo_output_topic: commands/servo/position

    # servo smoother - limits acceleration and smooths anything above limit
    max_acceleration: 2.5 # meters/second^2
    throttle_smoother_rate: 75.0 # messages/sec
    # servo smoother - limits rotation speed and smooths anything above limit
    max_servo_speed: 3.2 # radians/second
    servo_smoother_rate: 75.0 # messages/sec