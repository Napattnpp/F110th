odom_to_path_node:
  ros__parameters:
    # Topic names (can be remapped via launch)
    odom_topic: "/odom"
    path_topic: "/path"

    # Publish the full path once every N odom messages.
    # At 50 Hz odom and publish_every_n=5 the path publishes at ~10 Hz.
    publish_every_n: 5

    # Only add a new pose when the robot has moved at least this distance (metres).
    # Keeps the message size stable during slow / stationary periods.
    min_step_dist: 0.05

    # Maximum number of poses to keep in the path (ring-buffer).
    # Prevents unbounded memory growth on long runs.
    max_poses: 5000

    # Use the timestamp from the incoming Odometry message.
    # Set to false to use the node's wall-clock time instead.
    use_odom_stamp: true
