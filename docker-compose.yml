# ── Shared YAML anchors ───────────────────────────────────────────────────────

x-common-build-args: &common-build-args
  USER: ${USER}
  UID: ${HOST_UID:-1000}
  GID: ${HOST_GID:-1000}

x-common-settings: &common-settings
  restart: unless-stopped
  network_mode: host
  ipc: host
  pid: host
  privileged: true
  shm_size: "1gb"
  stdin_open: true
  tty: true
  environment:
    - DISPLAY=${DISPLAY}
    - XAUTHORITY=${XAUTHORITY}
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-21}
    - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
    - CYCLONEDDS_URI=file:///cyclonedds.xml
    - RACECAR_VERSION=${RACECAR_VERSION:-NUC1}
    - USER=${USER}
  volumes:
    # Hardware & device access
    - /dev:/dev
    - /run/udev:/run/udev:ro
    - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
    # X11 display & authentication
    - /tmp/.X11-unix:/tmp/.X11-unix
    - ${XAUTHORITY:-/tmp/.docker.xauth}:${XAUTHORITY:-/tmp/.docker.xauth}
    # Source code (repo root → workspace inside container)
    - .:/home/${USER}/F110th
    # Dedicated log volume (persists outside the colcon build output)
    - ~/f110th_logs:/logs
  command: /bin/bash

# ─────────────────────────────────────────────────────────────────────────────

services:

  # --------------------------------------------------------------------------
  # jetson — NVIDIA Jetson (on-car deployment, JetPack 6 / L4T r36.4)
  # --------------------------------------------------------------------------
  jetson:
    build:
      context: .
      dockerfile: .devcontainer/docker/Dockerfile.jetson
      args:
        <<: *common-build-args
    container_name: f1tenth_jetson
    image: ${DOCKERHUB_USER:-napattnpp}/${IMAGE_NAME:-f110th_img}:humble-jetson
    profiles: ["jetson"]
    runtime: nvidia
    <<: *common-settings
    volumes:
      # Hardware & device access
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      # Nvidia camera access (Jetson-specific)
      - /tmp/argus_socket:/tmp/argus_socket
      # X11 display
      - /tmp/.X11-unix:/tmp/.X11-unix
      # Source code
      - .:/home/${USER}/F110th
      # Logs
      - ~/f110th_logs:/logs

  # --------------------------------------------------------------------------
  # general — x86 / ARM laptop (development & simulation)
  # --------------------------------------------------------------------------
  general:
    build:
      context: .
      dockerfile: .devcontainer/docker/Dockerfile.general
      args:
        <<: *common-build-args
    container_name: f1tenth_general
    image: ${DOCKERHUB_USER:-napattnpp}/${IMAGE_NAME:-f110th_img}:humble-general
    profiles: ["general"]
    <<: *common-settings